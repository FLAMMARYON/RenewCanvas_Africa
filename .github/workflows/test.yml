name: Tests

# Run the Jest + React Testing Library suite on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  jest:
    name: Jest (unit + React Testing Library)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # --ignore-scripts skips the Prisma `postinstall` (the Jest suite never
      # touches the database client), keeping CI fast and free of secrets.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm run test:jest -- --ci
